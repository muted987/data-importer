name: Trigger E2E Tests

on:
  push:
    branches:
      - staging
  pull_request:
    branches:
      - staging
  workflow_dispatch:

jobs:
  trigger-e2e:
    name: Trigger E2E Test in e2e repo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Get short SHA
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT

      - name: Trigger E2E workflow
        uses: peter-evans/repository-dispatch@v4
        with:
          token: '${{ secrets.E2E_TRIGGER_TOKEN }}'
          repository: it-mentor-community-platform/e2e-tests
          event-type: run-e2e-tests
          client-payload: |
            {
              "data_importer_tag": "sha-${{ steps.vars.outputs.sha_short }}"
            }
      - name: Update status
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.payload.client_payload.repo_owner,
              repo: context.payload.client_payload.repo_name,
              sha: context.payload.client_payload.commit_sha,
              state: state,
              context: 'E2E Tests',
              description: state === 'success' ? 'E2E tests passed' : 'E2E tests failed',
              target_url: '${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}'
            });
