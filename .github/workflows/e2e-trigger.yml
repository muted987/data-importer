name: Trigger E2E Tests

on:
  pull_request:
    branches:
      - staging
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

jobs:
  trigger-and-wait:
    name: Trigger E2E Tests and Wait for Results
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Get short SHA
        id: vars
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          echo "sha_short=$SHA_SHORT" >> $GITHUB_OUTPUT
          # Уникальный идентификатор для этого запуска
          echo "unique_id=${{ github.run_id }}-${{ github.run_attempt }}" >> $GITHUB_OUTPUT

      - name: Trigger E2E workflow
        id: trigger
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ secrets.E2E_TRIGGER_TOKEN }}
          repository: it-mentor-community-platform/e2e-tests
          event-type: run-e2e-tests
          client-payload: |
            {
              "service": "data-importer",
              "service_tag": "sha-${{ steps.vars.outputs.sha_short }}",
              "source_run_id": "${{ steps.vars.outputs.unique_id }}",
              "source_repo": "${{ github.repository }}",
              "pr_number": "${{ github.event.pull_request.number }}"
            }

      - name: Wait for E2E results
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'it-mentor-community-platform';
            const repo = 'e2e-tests';
            const sourceRunId = '${{ steps.vars.outputs.unique_id }}';
            
            // Ждём до 30 минут
            const maxAttempts = 60;
            const delaySeconds = 30;
            
            for (let attempt = 1; attempt <= maxAttempts; attempt++) {
              console.log(`[Attempt ${attempt}/${maxAttempts}] Checking E2E test status...`);
              
              // Получаем последние запуски workflow в e2e-tests
              const { data: runs } = await github.rest.actions.listWorkflowRuns({
                owner,
                repo,
                workflow_id: 'e2e-tests.yml', // Замените на имя вашего workflow файла
                per_page: 30
              });
              
              // Ищем запуск, который был инициирован нашим source_run_id
              const targetRun = runs.workflow_runs.find(run => {
                // Проверяем display_title или смотрим в event
                if (run.display_title && run.display_title.includes(sourceRunId)) {
                  return true;
                }
                // Альтернативно проверяем payload, если сохранили в артефакты
                if (run.event === 'repository_dispatch' && 
                    run.created_at > new Date(Date.now() - 5*60*1000).toISOString()) {
                  // Дополнительная проверка через API dispatch details
                  return true;
                }
                return false;
              });
              
              if (targetRun) {
                console.log(`Found E2E run: ${targetRun.html_url}`);
                console.log(`Status: ${targetRun.status}, Conclusion: ${targetRun.conclusion || 'pending'}`);
                
                if (targetRun.status === 'completed') {
                  if (targetRun.conclusion === 'success') {
                    console.log('✅ E2E tests passed successfully!');
                    return;
                  } else if (targetRun.conclusion === 'failure') {
                    throw new Error(`❌ E2E tests failed with conclusion: ${targetRun.conclusion}`);
                  } else if (targetRun.conclusion === 'cancelled') {
                    throw new Error('❌ E2E tests were cancelled');
                  }
                }
              } else {
                console.log('Waiting for E2E workflow to start...');
              }
              
              // Ждём перед следующей проверкой
              await new Promise(resolve => setTimeout(resolve, delaySeconds * 1000));
            }
            
            throw new Error('⏰ Timeout waiting for E2E tests completion (30 minutes)');
